<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#eef0ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#081638;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#fbfaff;border-radius:20px;overflow:hidden;">
            <tr>
              <td style="background:#081638;padding:24px 28px;color:#ffffff;">
                <span style="font-family:Georgia,serif;font-style:italic;font-size:18px;">The</span>
                <strong style="font-size:22px;letter-spacing:-0.5px;">Makerie</strong>
                <span style="color:#b6ff00;">&#10022;</span>
              </td>
            </tr>
            <tr>
              <td style="height:3px;background:linear-gradient(90deg,#ae8aff,#f477d3,#ffbc91,#8ef0d3,#48d7f5);"></td>
            </tr>
            <tr>
              <td style="padding:28px;">
                <p style="margin:0 0 8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#4a5380;">Sign-in code</p>
                <p style="margin:0 0 20px;font-size:16px;line-height:1.5;">Enter this code in The Makerie to sign in to your studio.</p>
                <p style="margin:0 0 20px;font-family:'SFMono-Regular',Menlo,monospace;font-size:34px;font-weight:700;letter-spacing:8px;">{{ .Token }}</p>
                <p style="margin:0;font-size:13px;line-height:1.5;color:#4a5380;">The code expires in 10 minutes. If you didn&rsquo;t try to sign in, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
